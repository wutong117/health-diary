name: build-desktop-exe

# 用 GitHub 的 Windows runner 构建 Pake 桌面版（本机没有 Rust/MSVC，所以放到云端编译）
# 触发：仓库 Actions 页点 Run workflow，或由助手调用 API 触发
on:
  workflow_dispatch:
    inputs:
      url:
        description: '要打包的网址'
        required: true
        default: 'https://wutong117.github.io/health-diary/'
      appname:
        description: '应用名（英文，用于 exe 文件名）'
        required: true
        default: 'HealthDiary'

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - uses: dtolnay/rust-toolchain@stable

      - name: 缓存 Cargo 依赖（第二次构建会快很多）
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-pake-${{ runner.os }}-v1

      - name: 安装 Pake CLI
        run: npm install -g pake-cli

      - name: Pake 版本
        run: pake --version

      - name: 构建 exe
        shell: pwsh
        run: |
          pake "${{ inputs.url }}" `
            --name "${{ inputs.appname }}" `
            --icon ./icons/health-diary.ico `
            --width 1180 --height 820 `
            --targets x64

      - name: 收集产物（安装包 + 绿色版 exe）
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          # 1) 安装包：Pake 会把 msi 拷回仓库根目录
          Get-ChildItem -Recurse -Include *.msi -ErrorAction SilentlyContinue |
            Copy-Item -Destination dist -Force
          # 2) 绿色版 exe：Pake 其实是在自己的全局 npm 目录里编译的，产物不在仓库里
          $roots = @(
            'C:\npm\prefix\node_modules\pake-cli\src-tauri\target',
            (Join-Path $env:APPDATA 'npm\node_modules\pake-cli\src-tauri\target'),
            'C:\npm\prefix\node_modules\pake-cli'
          )
          foreach ($r in $roots) {
            if (-not (Test-Path $r)) { continue }
            Write-Host "搜索: $r"
            Get-ChildItem -Path $r -Recurse -Filter *.exe -ErrorAction SilentlyContinue |
              Where-Object { $_.Name -notmatch 'unins|uninstall|setup|crashpad' } |
              Copy-Item -Destination dist -Force
          }
          Write-Host '--- dist 内容 ---'
          Get-ChildItem dist -ErrorAction SilentlyContinue |
            Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,2)}} | Format-Table -AutoSize
          if (-not (Get-ChildItem dist -ErrorAction SilentlyContinue)) { throw '没有收集到任何产物' }

      - name: 上传产物
        uses: actions/upload-artifact@v4
        with:
          name: ${{ inputs.appname }}-exe
          path: dist/*
          if-no-files-found: error
          retention-days: 30
